<script>
  /*grab id of menuBar,sidebar above*/
  let menuBar = document.querySelector('#menuBar')
  let sidebar = document.querySelector('.sidebar')

  /*toggle to active class*/
  menuBar.onclick = function() {
    sidebar.classList.toggle('active');
